<template>

<template if:true={partner}>

    <div class="details-page">

        <template if:true={showOrdersList}>
            <c-partner-dashboard-partner-orders-list
                card-title={ordersCardTitle}
                partner-name={partner.partnerName}
                partner-metrics={partner}
                filter-type={ordersFilterType}
                partner-id={partner.partnerId}
                date-range={dateRange}
                custom-start-date={customStartDate}
                custom-end-date={customEndDate}
                onback={handleOrdersBack}>
            </c-partner-dashboard-partner-orders-list>
        </template>

        <template if:true={showDetailContent}>
        <button class="back-link" onclick={handleBack}>
            <lightning-icon icon-name="utility:back" size="x-small"></lightning-icon>
            <span>Back to Partner Directory</span>
        </button>

        <section class="hero-card">

            <div class="hero-icon">
                <lightning-icon icon-name="standard:account" size="large"></lightning-icon>
            </div>

            <div class="hero-copy">
                <h1 class="hero-title">{partner.partnerName}</h1>

                <div class="hero-meta">
                   <!-- <span>{regionLabel}</span>
                    <span class="pill pending-pill">{categoryLabel}</span>-->
                    <span>ID: {partner.clientId}</span>
                </div>
            </div>

        </section>

        <!-- 3 stat cards: Sales removed, now lives in the Sales Breakdown panel -->
        <section class="stats-grid">

            <article class="stat-card stat-card-clickable" role="button" tabindex="0" data-filter="ALL" data-title="Total Orders" onclick={handleStatCardClick} onkeydown={handleStatCardKeydown}>
                <div class="stat-icon orders">
                    <lightning-icon icon-name="utility:cart" size="small"></lightning-icon>
                </div>
                <div class="stat-title">Total Orders</div>
                <div class="stat-value">{purchasesLabel}</div>
                <div class="stat-subtitle">{completionRateLabel} completion rate</div>
            </article>

            <article class="stat-card stat-card-clickable" role="button" tabindex="0" data-filter="REALIZED" data-title="Realized Revenue" onclick={handleStatCardClick} onkeydown={handleStatCardKeydown}>
                <div class="stat-icon realized">
                    <lightning-icon icon-name="utility:success" size="small"></lightning-icon>
                </div>
                <div class="stat-title">Realized Revenue</div>
                <div class="stat-value">{realizedRevenueLabel}</div>
                <div class="stat-subtitle positive">{realizedPercentLabel}</div>
            </article>

            <article class="stat-card stat-card-clickable" role="button" tabindex="0" data-filter="AT_RISK" data-title="Revenue at Risk" onclick={handleStatCardClick} onkeydown={handleStatCardKeydown}>
                <div class="stat-icon risk">
                    <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>
                </div>
                <div class="stat-title">Revenue at Risk</div>
                <div class="stat-value">{revenueAtRiskLabel}</div>
                <div class="stat-subtitle negative">{revenueAtRiskPercentLabel}</div>
            </article>

        </section>

        <section class="details-columns slds-grid slds-wrap slds-gutters_small">
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                <div class="column-stack">
                    <div class="sales-revenue-pair">
                        <article class="panel-card panel-card-clickable sales-panel-side"
                            role="button" tabindex="0"
                            data-filter="ALL" data-title="Sales"
                            onclick={handleStatCardClick}
                            onkeydown={handleStatCardKeydown}>

                            <div class="panel-header">
                                <h2>Sales</h2>
                                <span class="sales-aov-badge">{aovLabel} AOV</span>
                            </div>

                            <div class="sales-total">{grossRevenueLabel}</div>

                            <div class="panel-divider"></div>

                            <div class="metric-row">
                                <span>QMoR Revenue</span>
                                <span class="metric-value-strong">{qmorRevenueLabel}</span>
                            </div>
                            <div class="breakdown-track">
                                <div class="breakdown-fill green" style={qmorProgressWidth}></div>
                            </div>
                            <div class="breakdown-caption">{qmorPercentLabel} &middot; Quest as Merchant of Record</div>

                            <div class="breakdown-row-spacer"></div>

                            <div class="metric-row">
                                <span>PMoR Revenue</span>
                                <span class="metric-value-strong">{pmorRevenueLabel}</span>
                            </div>
                            <div class="breakdown-track">
                                <div class="breakdown-fill blue" style={pmorProgressWidth}></div>
                            </div>
                            <div class="breakdown-caption">{pmorPercentLabel} &middot; Partner as Merchant of Record</div>

                        </article>

                        <article class="panel-card revenue-breakdown-side">

                            <div class="panel-header">
                                <h2>Revenue Breakdown</h2>
                            </div>

                            <div class="breakdown-row">
                                <div class="breakdown-top">
                                    <span>Realized Revenue</span>
                                    <strong class="positive">{realizedRevenueLabel}</strong>
                                </div>
                                <div class="breakdown-track">
                                    <div class="breakdown-fill green" style={realizedWidth}></div>
                                </div>
                            </div>

                            <div class="breakdown-row">
                                <div class="breakdown-top">
                                    <span>Lost Revenue</span>
                                    <strong class="negative">{lostRevenueLabel}</strong>
                                </div>
                                <div class="breakdown-track">
                                    <div class="breakdown-fill red" style={lostRevenueWidth}></div>
                                </div>
                            </div>

                            <div class="breakdown-row">
                                <div class="breakdown-top">
                                    <span>Revenue at Risk</span>
                                    <strong class="warning">{revenueAtRiskLabel}</strong>
                                </div>
                                <div class="breakdown-track">
                                    <div class="breakdown-fill gold" style={riskRevenueWidth}></div>
                                </div>
                            </div>

                        </article>
                    </div>

                    <article class="panel-card">

                        <div class="panel-header">
                            <h2>Geographic Performance</h2>
                        </div>

                        <div class="data-pill-row">
                            <span>Region</span>
                            <strong class="pending-value">{regionLabel}</strong>
                        </div>

                        <div class="data-pill-row">
                            <span>Avg distance to PSC</span>
                            <strong class="pending-value">{avgDistanceLabel}</strong>
                        </div>

                        <div class="data-pill-row">
                            <span>Lab Completion Rate</span>
                            <strong class="pending-value">{labCompletionRateLabel}</strong>
                        </div>

                    </article>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                <div class="column-stack">
                    <article class="panel-card">

                        <div class="panel-header">
                            <h2>Post-Purchase Funnel</h2>
                            <span class="panel-link">View All -></span>
                        </div>

                        <div class="metric-row">
                            <span>Purchases</span>
                            <span>{purchasesLabel}</span>
                        </div>
                        <div class="progress-track blue">
                            <div class="progress-fill blue" style={purchasesWidth}></div>
                            <span class="progress-label">100.0%</span>
                        </div>

                        <div class="metric-row completed">
                            <span>Completed</span>
                            <span>{completedOrdersLabel}</span>
                        </div>
                        <div class="progress-track green">
                            <div class="progress-fill green" style={completedWidth}></div>
                            <span class="progress-label">{completedPercentLabel}</span>
                        </div>

                        <div class="panel-divider"></div>

                        <div class="mini-metrics">
                            <div>
                                <div class="mini-label">Completion Rate</div>
                                <div class="mini-value">{completionRateLabel}</div>
                            </div>
                            <div>
                                <div class="mini-label">Within 5 Days</div>
                                <div class="mini-value">{completionWithinFiveDaysLabel}</div>
                            </div>
                        </div>

                    </article>

                    <template if:true={showCancellationRiskCard}>
                        <article class="panel-card risk-card panel-card-clickable"
                            role="button" tabindex="0"
                            data-filter="AT_RISK" data-title="60-Day Cancellation Risk"
                            onclick={handleStatCardClick}
                            onkeydown={handleStatCardKeydown}>

                            <div class="panel-header icon-header">
                                <div class="stat-icon risk large">
                                    <lightning-icon icon-name="utility:clock" size="small"></lightning-icon>
                                </div>
                                <h2>60-Day Cancellation Risk</h2>
                            </div>

                            <div class="risk-section">
                                <div class="risk-label">Orders Approaching Auto-Cancel</div>
                                <div class="risk-value">{cancellationRiskOrdersLabel}</div>
                                <div class="risk-caption">{cancellationRiskPercentLabel}</div>
                            </div>

                            <div class="panel-divider"></div>

                            <div class="risk-section">
                                <div class="risk-label">Revenue at Risk of Cancellation</div>
                                <div class="risk-money">{cancellationRiskRevenueLabel}</div>
                                <div class="risk-caption">Orders at 45-60 days since purchase</div>
                            </div>

                        </article>
                    </template>
                </div>
            </div>
        </section>

        </template>

    </div>

</template>

</template>
