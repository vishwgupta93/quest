<template>

<template if:true={partner}>

    <div class="details-shell">

        <template if:true={showOrdersList}>
            <c-partner-dashboard-partner-orders-list
                card-title={ordersCardTitle}
                partner-name={partner.partnerName}
                partner-metrics={partner}
                filter-type={ordersFilterType}
                ageing-drill-stage={ordersAgeingDrillStage}
                ageing-drill-bucket={ordersAgeingDrillBucket}
                partner-id={partner.partnerId}
                date-range={dateRange}
                custom-start-date={customStartDate}
                custom-end-date={customEndDate}
                onback={handleOrdersBack}>
            </c-partner-dashboard-partner-orders-list>
        </template>

        <template if:true={showDetailContent}>
            <button class="slds-button slds-button_reset back-link" onclick={handleBack}>
                <lightning-icon icon-name="utility:back" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                <span>Back to Partner Directory</span>
            </button>

            <lightning-card class="dashboard-tight-card">
                <div class="slds-p-around_small">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div class="slds-media slds-media_center">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <h1 class="slds-text-heading_small">{partner.partnerName}</h1>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                    ID: {partner.clientId}
                                </p>
                            </div>
                        </div>
                        <div class="header-actions">
                            <lightning-button
                                label="View Products"
                                onclick={handleViewProducts}>
                            </lightning-button>
                            <lightning-button-icon
                                icon-name="utility:edit"
                                alternative-text="Edit partner"
                                title="Edit partner"
                                onclick={handleEditPartner}>
                            </lightning-button-icon>
                        </div>
                    </div>
                </div>
            </lightning-card>

            <section class="slds-grid slds-wrap slds-gutters stats-grid row-section">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <div
                        class="card-action"
                        role="button"
                        tabindex="0"
                        data-filter="ALL"
                        data-title="New Orders"
                        onclick={handleStatCardClick}
                        onkeydown={handleStatCardKeydown}>
                        <lightning-card class="dashboard-tight-card" title="New Orders" icon-name="utility:cart">
                            <div class="slds-p-around_small stat-card-body">
                                <div class="slds-text-heading_small">{newOrdersLabel}</div>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{newOrdersRevenueLabel}</p>
                            </div>
                        </lightning-card>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <div
                        class="card-action"
                        role="button"
                        tabindex="0"
                        data-filter="REALIZED"
                        data-title="Resulted Orders"
                        onclick={handleStatCardClick}
                        onkeydown={handleStatCardKeydown}>
                        <lightning-card class="dashboard-tight-card" title="Resulted Orders" icon-name="utility:success">
                            <div class="slds-p-around_small stat-card-body">
                                <div class="slds-text-heading_small">{resultedOrdersLabel}</div>
                                <p class="slds-text-body_small slds-text-color_success slds-m-top_xx-small">{resultedRevenueLabel}</p>
                            </div>
                        </lightning-card>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <div
                        class="card-action"
                        role="button"
                        tabindex="0"
                        data-filter="CANCELLED"
                        data-title="Cancelled Orders"
                        onclick={handleStatCardClick}
                        onkeydown={handleStatCardKeydown}>
                        <lightning-card class="dashboard-tight-card" title="Cancelled Orders" icon-name="utility:warning">
                            <div class="slds-p-around_small stat-card-body">
                                <div class="slds-text-heading_small">{cancelledOrdersLabel}</div>
                                <p class="slds-text-body_small slds-text-color_error slds-m-top_xx-small">{cancelledRevenueLabel}</p>
                            </div>
                        </lightning-card>
                    </div>
                </div>
            </section>

            <div class="detail-stack">
                <section class="slds-grid slds-wrap slds-gutters detail-grid row-section">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <div
                            class="card-action"
                            role="button"
                            tabindex="0"
                            data-filter="ALL"
                            data-title="Sales"
                            onclick={handleStatCardClick}
                            onkeydown={handleStatCardKeydown}>
                            <lightning-card class="dashboard-tight-card" title="Sales" icon-name="utility:moneybag">
                                <div class="slds-p-around_small content-card-body">
                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                        <div class="slds-text-heading_small">{grossRevenueLabel}</div>
                                    </div>

                                    <template if:true={showMorRevenueSplit}>
                                        <div class="slds-m-top_small metric-group">
                                            <div class="slds-grid slds-grid_align-spread slds-text-body_regular">
                                                <span>QMoR</span>
                                                <span class="slds-text-title_bold">{qmorRevenueLabel}</span>
                                            </div>
                                            <div class="slds-m-top_x-small">
                                                <lightning-progress-bar value={qmorProgressValue} size="small"></lightning-progress-bar>
                                            </div>
                                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                                                {qmorPercentLabel} - Quest as Merchant of Record
                                            </p>
                                        </div>

                                        <div class="slds-m-top_small metric-group">
                                            <div class="slds-grid slds-grid_align-spread slds-text-body_regular">
                                                <span>PMoR</span>
                                                <span class="slds-text-title_bold">{pmorRevenueLabel}</span>
                                            </div>
                                            <div class="slds-m-top_x-small">
                                                <lightning-progress-bar value={pmorProgressValue} size="small"></lightning-progress-bar>
                                            </div>
                                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                                                {pmorPercentLabel} - Partner as Merchant of Record
                                            </p>
                                        </div>
                                    </template>
                                </div>
                            </lightning-card>
                        </div>
                    </div>

                    <template if:true={showPostPurchaseFunnelTile}>
                        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                            <div class="row-card">
                                <lightning-card class="dashboard-tight-card" title="Post-Purchase Funnel" icon-name="utility:graph">
                                    <div class="slds-p-around_small content-card-body">
                                    <div class="slds-grid slds-grid_align-spread slds-text-body_regular">
                                        <span>Purchases</span>
                                        <span class="slds-text-title_bold">{purchasesLabel}</span>
                                    </div>
                                    <div class="slds-m-top_x-small">
                                        <lightning-progress-bar value={purchasesProgressValue} size="small"></lightning-progress-bar>
                                    </div>
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">100.0%</p>

                                    <div class="slds-grid slds-grid_align-spread slds-text-body_regular slds-m-top_small">
                                        <span>Completed</span>
                                        <span class="slds-text-title_bold">{completedOrdersLabel}</span>
                                    </div>
                                    <div class="slds-m-top_x-small">
                                        <lightning-progress-bar value={completedProgressValue} size="small"></lightning-progress-bar>
                                    </div>
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">{completedPercentLabel}</p>

                                    <div class="slds-grid slds-gutters slds-m-top_small summary-grid">
                                        <div class="slds-col">
                                            <div class="slds-text-title">Completion Rate</div>
                                            <div class="slds-text-heading_small slds-m-top_x-small">{completionRateLabel}</div>
                                        </div>
                                        <div class="slds-col">
                                            <div class="slds-text-title">Within 5 Days</div>
                                            <div class="slds-text-heading_small slds-m-top_x-small">{completionWithinFiveDaysLabel}</div>
                                        </div>
                                    </div>
                                    </div>
                                </lightning-card>
                            </div>
                        </div>
                    </template>
                </section>

                <section class="row-section">
                    <c-partner-dashboard-open-order-ageing-analysis
                        partner-id={partner.partnerId}
                        onopenageingdrill={handleOpenAgeingDrill}>
                    </c-partner-dashboard-open-order-ageing-analysis>
                </section>

                <section class="slds-grid slds-wrap slds-gutters detail-grid row-section">
                    <template if:true={showRevenueBreakdownTile}>
                        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                            <div class="row-card">
                                <lightning-card class="dashboard-tight-card" title="Revenue Breakdown" icon-name="utility:chart">
                                    <div class="slds-p-around_small content-card-body">
                                    <div class="metric-group">
                                        <div class="slds-grid slds-grid_align-spread slds-text-body_regular">
                                            <span>Realized Revenue</span>
                                            <span class="slds-text-color_success slds-text-title_bold">{realizedRevenueLabel}</span>
                                        </div>
                                        <div class="slds-m-top_x-small">
                                            <lightning-progress-bar value={realizedProgressValue} size="small"></lightning-progress-bar>
                                        </div>
                                    </div>

                                    <div class="slds-m-top_small metric-group">
                                        <div class="slds-grid slds-grid_align-spread slds-text-body_regular">
                                            <span>Lost Revenue</span>
                                            <span class="slds-text-color_error slds-text-title_bold">{lostRevenueLabel}</span>
                                        </div>
                                        <div class="slds-m-top_x-small">
                                            <lightning-progress-bar value={lostRevenueProgressValue} size="small"></lightning-progress-bar>
                                        </div>
                                    </div>

                                    <div class="slds-m-top_small metric-group">
                                        <div class="slds-grid slds-grid_align-spread slds-text-body_regular">
                                            <span>Revenue at Risk</span>
                                            <span class="slds-text-color_warning slds-text-title_bold">{revenueAtRiskLabel}</span>
                                        </div>
                                        <div class="slds-m-top_x-small">
                                            <lightning-progress-bar value={riskRevenueProgressValue} size="small"></lightning-progress-bar>
                                        </div>
                                    </div>
                                    </div>
                                </lightning-card>
                            </div>
                        </div>
                    </template>

                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <div class="row-card">
                            <lightning-card class="dashboard-tight-card" title="Geographic Performance" icon-name="utility:location">
                                <div class="slds-p-around_small content-card-body">
                                <div class="data-row slds-grid slds-grid_align-spread">
                                    <span>Region</span>
                                    <span class="slds-text-title_bold">{regionLabel}</span>
                                </div>
                                <div class="data-row slds-grid slds-grid_align-spread slds-m-top_small">
                                    <span>Avg distance to PSC</span>
                                    <span class="slds-text-title_bold">{avgDistanceLabel}</span>
                                </div>
                                <div class="data-row slds-grid slds-grid_align-spread slds-m-top_small">
                                    <span>Lab Completion Rate</span>
                                    <span class="slds-text-title_bold">{labCompletionRateLabel}</span>
                                </div>
                                </div>
                            </lightning-card>
                        </div> 
                    </div>
                </section>

                <template if:true={showCancellationRiskCard}>
                    <section class="row-section">
                        <div
                            class="card-action"
                            role="button"
                            tabindex="0"
                            data-filter="AT_RISK"
                            data-title="60-Day Cancellation Risk"
                            onclick={handleStatCardClick}
                            onkeydown={handleStatCardKeydown}>
                            <lightning-card class="dashboard-tight-card" title="60-Day Cancellation Risk" icon-name="utility:clock">
                                <div class="slds-p-around_small">
                                    <div class="slds-text-title">Orders Approaching Auto-Cancel</div>
                                    <div class="slds-text-heading_medium slds-m-top_xx-small">{cancellationRiskOrdersLabel}</div>
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{cancellationRiskPercentLabel}</p>

                                    <div class="slds-m-top_small">
                                        <div class="slds-text-title">Revenue at Risk of Cancellation</div>
                                        <div class="slds-text-heading_small slds-text-color_error slds-m-top_xx-small">{cancellationRiskRevenueLabel}</div>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                            Orders at 45-60 days since purchase
                                        </p>
                                    </div>
                                </div>
                            </lightning-card>
                        </div>
                    </section>
                </template>
            </div>

        </template>

    </div>

</template>

</template>
