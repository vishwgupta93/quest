<template>

<div class="tile-action" onclick={handleClick} onkeydown={handleKeydown} role="button" tabindex="0">
    <lightning-card>
        <div class="slds-p-around_medium tile-body">
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <div class="slds-media slds-media_center">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <div class="slds-text-title_bold partner-name">{partner.partnerName}</div>
                        <div class="slds-text-body_small slds-text-color_weak">ID: {partner.clientId}</div>
                    </div>
                </div>

                <div class="slds-grid slds-grid_vertical-align-center slds-gutters_x-small">
                    <div>
                        <lightning-badge label={categoryLabel}></lightning-badge>
                    </div>
                    <div>
                        <lightning-button-icon
                            icon-name="utility:edit"
                            variant="bare"
                            alternative-text="Edit partner"
                            title="Edit partner"
                            onclick={handleEditClick}>
                        </lightning-button-icon>
                    </div>
                </div>
            </div>

            <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">
                <div class="slds-col slds-size_1-of-2">
                    <div class="slds-text-title">Orders</div>
                    <div class="slds-text-heading_small slds-m-top_x-small">{partner.totalOrders}</div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class="slds-text-title">Revenue</div>
                    <div class="slds-text-heading_small slds-m-top_x-small">{grossRevenueLabel}</div>
                </div>
            </div>

            <template if:true={showCancellationRisk}>
                <div class="slds-box slds-theme_alert-texture slds-theme_error slds-m-top_medium risk-box">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div class="slds-text-body_small slds-text-title_bold">
                            60-Day Cancellation Risk
                        </div>
                        <div class="slds-text-body_small slds-text-title_bold">
                            {riskRevenueLabel}
                        </div>
                    </div>
                    <div class="slds-text-body_small slds-m-top_x-small">
                        {riskOrdersLabel} orders
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</div>

</template>
