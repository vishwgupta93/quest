<template>

<lightning-card title="Partner Performance">
    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
        <template if:true={isLoading}>
            <div class="slds-is-relative loading-region">
                <lightning-spinner
                    alternative-text="Loading partner performance"
                    size="small">
                </lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:true={hasRows}>
                <lightning-datatable
                    key-field="partnerId"
                    data={rows}
                    columns={columns}
                    hide-checkbox-column
                    resize-column-disabled
                    sorted-by={sortedBy}
                    sorted-direction={sortDirection}
                    onsort={handleSort}
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </template>

            <template if:false={hasRows}>
                <div class="slds-align_absolute-center slds-text-body_regular slds-text-color_weak empty-state">
                    No partner performance data is available for the selected filters.
                </div>
            </template>
        </template>
    </div>
</lightning-card>

</template>
