<template>

<template if:true={isAuthPage}>
<div class="auth-layout slds-grid slds-wrap slds-theme_default">

    <section class="auth-brand-panel slds-col slds-size_1-of-1 slds-large-size_3-of-12 slds-p-around_large">

        <div class="auth-brand-inner">
            <img src={logoUrl} class="auth-logo"/>

            <div class="slds-text-heading_large slds-m-bottom_x-small">
                HealthTech Portal
            </div>

            <div class="slds-text-body_regular slds-text-color_weak">
                Partner Analytics
            </div>
        </div>

    </section>

    <section class="auth-content slds-col slds-size_1-of-1 slds-large-size_9-of-12 slds-p-around_large">
        <div class="auth-card-shell slds-card slds-p-around_large">
            <slot></slot>
        </div>
    </section>

</div>
</template>

<template if:false={isAuthPage}>
<div class="layout slds-grid">

    <!-- MOBILE HEADER -->
    <div class="header slds-grid slds-grid_vertical-align-center slds-p-horizontal_small">

        <lightning-button-icon
            icon-name="utility:rows"
            alternative-text="Menu"
            onclick={toggleSidebar}
            class="hamburger">
        </lightning-button-icon>

        <div class="header-title slds-text-title_bold slds-m-left_small">
            Quest HealthTech Portal
        </div>

    </div>

    <!-- OVERLAY -->
    <div class={overlayClass} onclick={toggleSidebar}></div>

    <!-- SIDEBAR -->
    <div class={sidebarClass}>
        <c-partner-dashboard-sidebar-navigation></c-partner-dashboard-sidebar-navigation>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <template if:true={showPageHeader}>
            <div class="page-header-region slds-p-around_medium">
                <slot name="page-header">
                    <c-partner-dashboard-page-filters
                        embedded
                        show-actions={headerConfig.showActions}
                        show-partner-search={headerConfig.showPartnerSearch}
                        show-date-range={headerConfig.showDateRange}
                        show-category-filter={headerConfig.showCategoryFilter}
                        title={headerConfig.title}
                        subtitle={headerConfig.subtitle}
                        search-placeholder={headerConfig.searchPlaceholder}
                        selected-partner-id={selectedPartnerId}
                        date-range={selectedDateRange}
                        custom-start-date={selectedCustomStartDate}
                        custom-end-date={selectedCustomEndDate}>
                    </c-partner-dashboard-page-filters>
                </slot>
            </div>
        </template>

        <div class="page-body slds-p-around_medium">
            <slot></slot>
        </div>
    </div>

</div>
</template>

</template>
