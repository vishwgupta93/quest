<template>

<aside class="sidebar-shell">
    <div class="slds-p-around_medium sidebar-header">
        <img src={logoUrl} alt="Quest" class="logo" />
        <h2 class="slds-text-heading_medium slds-m-top_small">HealthTech Portal</h2>
        <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">Partner Analytics</p>
    </div>

    <div class="slds-p-horizontal_small slds-p-bottom_medium">
        <lightning-vertical-navigation selected-item={currentPage} onselect={handleSelect}>
            <lightning-vertical-navigation-section label="Navigation">
                <template for:each={menuItems} for:item="item">
                    <lightning-vertical-navigation-item-icon
                        key={item.page}
                        name={item.page}
                        label={item.label}
                        icon-name={item.icon}>
                    </lightning-vertical-navigation-item-icon>
                </template>
            </lightning-vertical-navigation-section>
        </lightning-vertical-navigation>
    </div>
</aside>

</template>
