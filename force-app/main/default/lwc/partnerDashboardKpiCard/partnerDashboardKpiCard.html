<template>

<lightning-card>
    <div class="card-header slds-media slds-media_center slds-p-horizontal_medium slds-p-top_small slds-p-bottom_x-small">
        <template if:true={icon}>
            <div class="slds-media__figure">
                <lightning-icon icon-name={icon} size="x-small"></lightning-icon>
            </div>
        </template>
        <div class="slds-media__body">
            <h2 class="card-title">
                {title}
            </h2>
        </div>
    </div>
    <div class="slds-p-around_medium slds-grid slds-grid_vertical slds-grid_align-spread card-body">
        <div class="slds-grow">
            <div class="slds-text-heading_medium slds-m-bottom_x-small">
                {value}
            </div>

            <template if:true={subtitle}>
                <p class="slds-text-body_small slds-text-color_weak">
                    {subtitle}
                </p>
            </template>
        </div>

        <div class="slds-m-top_medium">
            <template if:true={progress}>
                <div>
                    <div class="slds-grid slds-grid_align-spread slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                        <span>{progressLabel}</span>
                        <span class="slds-text-color_default">{progressValue}</span>
                    </div>
                    <lightning-progress-bar
                        value={progress}
                        size="small">
                    </lightning-progress-bar>
                </div>
            </template>

            <template if:true={trendValue}>
                <div class="slds-m-top_small slds-text-body_small">
                    <span class={trendColorClass}>{trendValue}</span>

                    <template if:true={trendCompareLine}>
                        <span class="slds-m-left_x-small slds-text-color_weak">
                            {trendCompareLine}
                        </span>
                    </template>
                </div>
            </template>

            <template if:true={highlightText}>
                <p class="slds-m-top_small slds-text-body_small slds-text-color_error slds-font-weight_semibold">
                    {highlightText}
                </p>
            </template>
        </div>
    </div>
</lightning-card>

</template>
