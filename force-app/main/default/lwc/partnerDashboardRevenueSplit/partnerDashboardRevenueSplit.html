<template>

<div class="revenue-grid">
    <div class="revenue-cell">
        <lightning-card title="QMoR Revenue" icon-name="utility:moneybag">
            <div class="slds-p-around_medium card-body">
                <template if:true={isLoading}>
                    <div class="slds-is-relative loading-region">
                        <lightning-spinner alternative-text="Loading QMoR revenue" size="small"></lightning-spinner>
                    </div>
                </template>

                <template if:false={isLoading}>
                    <p class="slds-text-body_small slds-text-color_weak">
                        Quest as Merchant of Record
                    </p>
                    <div class="slds-text-heading_large value-row">
                        {qmorFormatted}
                    </div>
                    <div class="progress-row">
                        <lightning-progress-bar
                            value={qmorPercent}
                            size="small">
                        </lightning-progress-bar>
                    </div>
                    <p class="slds-text-body_small slds-text-color_weak percent-row">
                        {qmorPercentLabel}
                    </p>
                </template>
            </div>
        </lightning-card>
    </div>

    <div class="revenue-cell">
        <lightning-card title="PMoR Revenue" icon-name="utility:user">
            <div class="slds-p-around_medium card-body">
                <template if:true={isLoading}>
                    <div class="slds-is-relative loading-region">
                        <lightning-spinner alternative-text="Loading PMoR revenue" size="small"></lightning-spinner>
                    </div>
                </template>

                <template if:false={isLoading}>
                    <p class="slds-text-body_small slds-text-color_weak">
                        Partner as Merchant of Record
                    </p>
                    <div class="slds-text-heading_large value-row">
                        {pmorFormatted}
                    </div>
                    <div class="progress-row">
                        <lightning-progress-bar
                            value={pmorPercent}
                            size="small">
                        </lightning-progress-bar>
                    </div>
                    <p class="slds-text-body_small slds-text-color_weak percent-row">
                        {pmorPercentLabel}
                    </p>
                </template>
            </div>
        </lightning-card>
    </div>
</div>

</template>
