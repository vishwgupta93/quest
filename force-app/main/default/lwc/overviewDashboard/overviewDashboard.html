<template>

<div class="overview-shell">

    <section class="overview-section">
        <div class="kpi-grid">
            <div class="kpi-cell">
                <c-partner-dashboard-kpi-card
                    title="Sales"
                    value={salesLabel}
                    subtitle="Total cash captured"
                    icon="utility:trending">
                </c-partner-dashboard-kpi-card>
            </div>

            <div class="kpi-cell">
                <c-partner-dashboard-kpi-card
                    title="Realized Revenue - Same Month"
                    value={realizedSameMonthLabel}
                    subtitle="Tests bought &amp; completed same month"
                    icon="utility:flash"
                    trend-value={realizedSameMonthTrendValue}
                    trend-direction="up"
                    trend-compare-text="">
                </c-partner-dashboard-kpi-card>
            </div>

            <div class="kpi-cell">
                <c-partner-dashboard-kpi-card
                    title="Realized Revenue"
                    value={realizedRevenueLabel}
                    subtitle="From completed tests at PSCs"
                    icon="utility:success">
                </c-partner-dashboard-kpi-card>
            </div>

            <div class="kpi-cell">
                <c-partner-dashboard-kpi-card
                    title="Auto-Cancellation Risk"
                    value={cancellationRiskLabel}
                    subtitle={cancellationRiskSubtitle}
                    icon="utility:clock"
                    highlight-text="Orders at 45-60 days">
                </c-partner-dashboard-kpi-card>
            </div>

            <div class="kpi-cell">
                <c-partner-dashboard-kpi-card
                    title="Refund Liability"
                    value={refundLiabilityLabel}
                    subtitle="Tests nearing 30-day expiration"
                    icon="utility:warning">
                </c-partner-dashboard-kpi-card>
            </div>
        </div>
    </section>

    <section class="overview-section">
        <c-partner-dashboard-revenue-split
            is-loading={isLoadingSummary}
            qmor-revenue={summary.qmorRevenue}
            pmor-revenue={summary.pmorRevenue}
            gross-revenue={summary.grossRevenue}>
        </c-partner-dashboard-revenue-split>
    </section>

    <section class="overview-section">
        <c-partner-dashboard-partner-performance-table
            date-range={selectedDateRange}>
        </c-partner-dashboard-partner-performance-table>
    </section>

</div>

</template>
