<template>
	<lightning-spinner if:true={showSpinner} alternative-text="Loading" size="large"></lightning-spinner>
	<template if:true={errormsg}>
		<div class="qd-error-high-level qd-error-high-level-theme-error qd-mb-md" tabindex="-1" role="alert" aria-live="assertive"><svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 5.5V10.75" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M13.4173 1H6.58274C6.48425 1 6.38672 1.0194 6.29573 1.05709C6.20473 1.09478 6.12205 1.15003 6.05241 1.21967L1.21967 6.05241C1.15003 6.12205 1.09478 6.20473 1.05709 6.29573C1.0194 6.38672 1 6.48425 1 6.58274V13.4173C1 13.5158 1.0194 13.6133 1.05709 13.7043C1.09478 13.7953 1.15003 13.8779 1.21967 13.9476L6.05241 18.7803C6.12205 18.85 6.20473 18.9052 6.29573 18.9429C6.38672 18.9806 6.48425 19 6.58274 19H13.4173C13.5158 19 13.6133 18.9806 13.7043 18.9429C13.7953 18.9052 13.8779 18.85 13.9476 18.7803L18.7803 13.9476C18.85 13.8779 18.9052 13.7953 18.9429 13.7043C18.9806 13.6133 19 13.5158 19 13.4173V6.58274C19 6.48425 18.9806 6.38672 18.9429 6.29573C18.9052 6.20473 18.85 6.12205 18.7803 6.05241L13.9476 1.21967C13.8779 1.15003 13.7953 1.09478 13.7043 1.05709C13.6133 1.0194 13.5158 1 13.4173 1Z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10 15.0625C10.5178 15.0625 10.9375 14.6428 10.9375 14.125C10.9375 13.6072 10.5178 13.1875 10 13.1875C9.48223 13.1875 9.0625 13.6072 9.0625 14.125C9.0625 14.6428 9.48223 15.0625 10 15.0625Z" fill="white"></path></svg><div class="qd-error-high-level-content"><ul class="error-list"><li class="error-item"><strong>{errormsg}</strong></li></ul></div></div>
	</template>
	<div class="qd-card-primary qd-order-lookup">
		<div class="qd-card-title">Order look up</div>
		<div class="qd-text-base qd-mb-lg">{placeHolderText}</div>
		<div>
			<lightning-input
				onchange={handleOrderNumberChange}
				onkeypress={handleKeypress}
				value={orderNumber}
				type="text"
				placeholder="Order number"
				required
				variant="label-hidden"
				class="qd-mb-lg"
			></lightning-input>
			<button
					type="button"
					onclick={searchOrder}
					class="qd-button-primary qd-mb-lg qd-w-100"
				>Find My Tests</button>
		</div>
		<div class="qd-grayscale-100-background qd-border-radius-sm qd-p-md">
			<div class="qd-text-lg qd-green-700-text qd-mb-sm"><strong>Can't find your order?</strong></div>
			<div class="qd-text-base"> You can find the order number in your purchase confirmation email. If you have any questions or need assistance, our <a href={label.CustomerCareNumber}>support team</a> is here to help.</div>
		</div>
	</div>
</template>
