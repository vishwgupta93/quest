<template>

<div class="directory-shell">

    <template if:true={isLoadingPartners}>
        <div class="slds-is-relative loading-region">
            <lightning-spinner
                alternative-text="Loading partner directory"
                size="small">
            </lightning-spinner>
        </div>
    </template>

    <template if:true={isLoadingDetails}>
        <div class="slds-is-relative loading-region details-loading">
            <lightning-spinner
                alternative-text="Loading partner details"
                size="small">
            </lightning-spinner>
        </div>
    </template>

    <template if:true={showPartnerDetails}>
        <c-partner-dashboard-partner-details
            partner={selectedPartner}
            date-range={selectedDateRange}
            custom-start-date={selectedCustomStartDate}
            custom-end-date={selectedCustomEndDate}
            onback={handleBackToDirectory}>
        </c-partner-dashboard-partner-details>
    </template>

    <template if:true={showDirectoryGrid}>
        <div class="slds-grid slds-wrap slds-gutters directory-grid">
            <template for:each={partners} for:item="partner">
                <div key={partner.partnerId} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 directory-col">
                    <c-partner-dashboard-partner-directory-tile
                        partner={partner}
                        onpartnerselect={handlePartnerSelect}
                        onpartneredit={handlePartnerEdit}>
                    </c-partner-dashboard-partner-directory-tile>
                </div>
            </template>
        </div>
    </template>

    <template if:true={loadError}>
        <lightning-card title="Partner Directory">
            <div class="slds-p-around_medium slds-text-color_error">
                Unable to load partner dashboard data.
            </div>
        </lightning-card>
    </template>

</div>

</template>
