<template>

<section class={containerClass}>

    <div class="slds-grid slds-wrap slds-gutters slds-grid_vertical-align-end slds-m-bottom_medium">
        <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12 slds-medium-size_8-of-12">
            <h1 class="slds-text-heading_medium slds-text-title_bold">{title}</h1>
            <template if:true={subtitle}>
                <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">
                    {subtitle}
                </p>
            </template>
        </div>

        <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 slds-medium-size_4-of-12">
            <div class="actions-slot slds-grid slds-wrap slds-grid_align-end slds-gutters_x-small">
                <template if:true={showActions}>
                    <lightning-button
                        label="Export Data"
                        onclick={handleExportData}>
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Generate Report"
                        onclick={handleGenerateReport}>
                    </lightning-button>
                </template>
                <template if:false={showActions}>
                    <slot name="actions"></slot>
                </template>
            </div>
        </div>
    </div>

    <div class="slds-grid slds-wrap slds-gutters slds-grid_vertical-align-end">

        <template if:true={showPartnerSearch}>
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12 slds-medium-size_1-of-1 filter-item">
                <lightning-record-picker
                    object-api-name="PartnerClientMap__c"
                    label="Search partners"
                    variant="label-hidden"
                    placeholder={searchPlaceholder}
                    value={selectedPartnerId}
                    onchange={handlePartnerChange}>
                </lightning-record-picker>
            </div>
        </template>

        <template if:true={showDateRange}>
            <div class={dateRangeClass}>
                <lightning-combobox
                    name="dateRange"
                    label="Date range"
                    variant="label-hidden"
                    value={selectedDateRange}
                    options={dateRangeOptions}
                    onchange={handleDateRangeChange}>
                </lightning-combobox>
            </div>
        </template>

        <template if:true={showCategoryFilter}>
            <div class={categoryClass}>
                <lightning-combobox
                    name="category"
                    label="Category"
                    variant="label-hidden"
                    value="ALL"
                    options={categoryOptions}
                    disabled>
                </lightning-combobox>
            </div>
        </template>

    </div>

    <template if:true={showCustomDateSection}>
        <div class="custom-date-section slds-m-top_small slds-border_top slds-p-top_small">
            <div class="slds-grid slds-wrap slds-gutters slds-grid_vertical-align-end">
                <div class="slds-col slds-size_1-of-1 slds-large-size_3-of-12 slds-medium-size_4-of-12 filter-item">
                    <label class="slds-form-element__label" for="customStartDate">From</label>
                    <input
                        id="customStartDate"
                        class="slds-input"
                        type="date"
                        value={selectedCustomStartDate}
                        onchange={handleCustomStartDateChange} />
                </div>

                <div class="slds-col slds-size_1-of-1 slds-large-size_3-of-12 slds-medium-size_4-of-12 filter-item">
                    <label class="slds-form-element__label" for="customEndDate">To</label>
                    <input
                        id="customEndDate"
                        class="slds-input"
                        type="date"
                        value={selectedCustomEndDate}
                        onchange={handleCustomEndDateChange} />
                </div>

                <div class="slds-col slds-size_1-of-1 slds-large-size_3-of-12 slds-medium-size_4-of-12 filter-item">
                    <div class="slds-grid slds-grid_vertical-align-center slds-gutters_x-small">
                        <div class="slds-col slds-grow-none">
                            <lightning-button
                                variant="neutral"
                                label="Clear"
                                onclick={handleClearCustomDates}>
                            </lightning-button>
                        </div>
                        <div class="slds-col slds-grow-none">
                            <lightning-button
                                variant="brand"
                                label="Apply"
                                onclick={handleApplyCustomDates}
                                disabled={disableApplyCustomDates}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

</section>

</template>
